kind: Deployment
apiVersion: apps/v1
metadata:
  name: chatapp-backend
  namespace: chat-app
  labels:
    feature: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      feature: backend
  template:
    metadata:
      labels:
        feature: backend
    spec:
      initContainers:
      - name: wait-for-mongo
        image: busybox:1.36
        imagePullPolicy: IfNotPresent
        command:
          - sh
          - -c
          - |
            until nc -z mongo 27017; do
              echo "Waiting for MongoDB..."
              sleep 2
            done
      containers:
      - name: chatapp-backend
        image: saadzahid/fullstack-chatapp-backend:v2
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 5001
        env:
        - name: NODE_ENV
          value: "development"
        - name: PORT
          value: "5001"
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: chatapp-secret
              key: JWT_SECRET
        - name: MONGODB_URI
          value: mongodb://root:nvBWAlnJJEr}NC){@mongo:27017/chatApp?authSource=admin&retryWrites=true&w=majority
        resources:
          limits:
            memory: "512Mi"
            cpu: "500m"
          requests:
            memory: "256Mi"
            cpu: "250m"