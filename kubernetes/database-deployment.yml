kind: Deployment
apiVersion: apps/v1
metadata:
  name: chatapp-mongodb
  namespace: chat-app
  labels:
    app: chatapp
    feature: database
spec:
  selector:
    matchLabels:
      feature: database
  serviceName: "chatapp-mongodb"
  replicas: 2
  minReadySeconds: 10
  template:
    metadata:
      labels:
        app: chatapp
        feature: database
    spec:
      terminationGracePeriodSeconds: 10
      containers:
      - name: mongodb
        image: mongo:4.4
        ports:
        - containerPort: 27017
        volumeMounts:
        - name: mongodb-data
          mountPath: /data/db
        env:
        - name: MONGO_INITDB_ROOT_USERNAME
          value: "root"
        - name: MONGO_INITDB_ROOT_PASSWORD
          value: "admin"
      volumes:
      - name: mongodb-data
        persistentVolumeClaim:
          claimName: mongodb-data