apiVersion: apps/v1
kind: Deployment
metadata:
  name: chatapp-mongodb
  namespace: chat-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: chatapp-mongodb
  template:
    metadata:
      labels:
        app: chatapp-mongodb
    spec:
      containers:
      - name: mongodb
        image: iemafzal/mongodb:v1
        ports:
        - containerPort: 27017
        env:
        - name: MONGO_INITDB_ROOT_USERNAME
          value: root
        - name: MONGO_INITDB_ROOT_PASSWORD
          value: admin
        volumeMounts:
        - name: mongo-data
          mountPath: /data/db
      volumes:
      - name: mongo-data
        persistentVolumeClaim:
          claimName: mongodb-data