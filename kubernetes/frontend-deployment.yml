kind: Deployment
apiVersion: apps/v1
metadata:
  name: chatapp-frontend
  namespace: chat-app
  labels:
    feature: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      feature: frontend
  template:
    metadata:
      labels:
        feature: frontend
    spec:
      initContainers:
      - name: wait-for-backend
        image: busybox:1.36
        command:
          - sh
          - -c
          - |
            until nc -z backend 5001; do
              echo "Waiting for backend..."
              sleep 2
            done
      containers:
      - name: chatapp-frontend
        image: saadzahid/fullstack-chatapp-frontend:v2
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 80
        env:
        - name: NODE_ENV
          value: "development"
        - name: BACKEND_URL
          value: "http://backend:5001"
        resources:
          limits:
            memory: "256Mi"
            cpu: "200m"
          requests:
            memory: "128Mi"
            cpu: "100m"
        volumeMounts:
        - name: nginx-conf
          mountPath: /etc/nginx/conf.d/
          subPath: default.conf
      volumes:
      - name: nginx-conf
        configMap:
          name: nginx-config